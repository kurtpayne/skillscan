name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Bumped from 30 → 45 on 2026-05-20. Recent successful test (3.12) runs
    # have been finishing in 24-29 min (very close to the prior 30-min
    # ceiling), and sync-bundled-snapshot PRs from May 17 onward all hit the
    # ceiling and got cancelled. Root cause is test-suite growth; 50%
    # headroom buys time to land the backlog while a permanent fix (slow-
    # test markers + a split fast/slow lane) is designed.
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    env:
      # P5: Prevent user-local ~/.skillscan/rules/ from influencing test results.
      # Tests must pass against the bundled rulepack only (post-mortem action item).
      SKILLSCAN_NO_USER_RULES: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          # Need full history for the paths-filter action to diff against base.
          fetch-depth: 0
      # Fast-lane gate: PRs that only touch `src/skillscan/data/**` (i.e., the
      # daily agent's bundled-snapshot sync PRs) don't need the 30+min full
      # test suite. They get a <1s validator instead. Branch protection still
      # sees `test (3.12)` / `test (3.13)` reporting green either way.
      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '!src/skillscan/data/**'
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - '.github/workflows/**'
            data:
              - 'src/skillscan/data/**'
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (data-only fast-lane — minimal deps)
        if: steps.changes.outputs.code != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Validate bundled data only (fast lane)
        if: steps.changes.outputs.code != 'true'
        run: |
          echo "Fast-lane: only src/skillscan/data/** changed; skipping full test suite."
          python3 scripts/validate_bundled_data.py
      - name: Install (code-touching PR — full deps)
        if: steps.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Format check
        if: steps.changes.outputs.code == 'true' && matrix.python-version == '3.12'
        run: |
          ruff format --check src tests
      - name: Lint
        if: steps.changes.outputs.code == 'true' && matrix.python-version == '3.12'
        run: |
          ruff check src tests
      - name: Type Check
        if: steps.changes.outputs.code == 'true' && matrix.python-version == '3.12'
        run: |
          mypy src
      - name: Tests with coverage
        if: steps.changes.outputs.code == 'true' && matrix.python-version == '3.12'
        # -n auto: spawn one worker per CPU core (2 on ubuntu-latest, sometimes 4)
        # --dist=loadfile: keep all tests from the same file in the same worker
        #   (safer than the default `load` distribution against any per-file
        #   fixture ordering hazards; conftest's lru_cache clear is per-test
        #   so already safe across workers, but loadfile costs almost nothing
        #   and removes a class of "passes serially / fails in parallel" bugs)
        run: |
          pytest -q -n auto --dist=loadfile --cov=skillscan --cov-report=xml --cov-report=term
      - name: Tests
        if: steps.changes.outputs.code == 'true' && matrix.python-version != '3.12'
        run: |
          pytest -q -n auto --dist=loadfile
      - name: Upload coverage to Codecov
        if: steps.changes.outputs.code == 'true' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  website-drift:
    name: Detect website rule drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: skillscan-security
      - name: Check out website (skip gracefully if token unavailable)
        id: checkout-website
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          repository: kurtpayne/skillscan-website
          path: skillscan-website
      - name: Setup Python
        if: steps.checkout-website.outcome == 'success'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PyYAML
        if: steps.checkout-website.outcome == 'success'
        run: pip install pyyaml
      - name: Check website rule sync
        if: steps.checkout-website.outcome == 'success'
        continue-on-error: true
        run: |
          python3 skillscan-security/scripts/sync-website-rules.py \
            --website-dir skillscan-website \
            --dry-run
          EXIT=$?
          if [ $EXIT -eq 2 ]; then
            echo ""
            echo "::error::Website TSX files are out of sync with default.yaml."
            echo "::error::Run: python3 scripts/sync-website-rules.py"
            echo "::error::Then commit the updated TSX files."
            exit 1
          elif [ $EXIT -eq 1 ]; then
            echo "::error::sync-website-rules.py encountered an error."
            exit 1
          fi
          echo "Website rule files are in sync."

  cross-tool-recall:
    name: Cross-tool recall vs Cisco skill-scanner fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install SkillScan
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Clone Cisco skill-scanner test fixtures
        run: |
          git clone --depth=1 https://github.com/cisco-ai-defense/skill-scanner /tmp/cisco-skill-scanner
      - name: Verify malicious fixtures are caught
        run: |
          FAIL=0
          for skill_dir in exfiltrator prompt-injection; do
            FIXTURE="/tmp/cisco-skill-scanner/evals/test_skills/malicious/${skill_dir}"
            echo "=== Scanning ${skill_dir} ==="
            OUTPUT=$(skillscan scan "$FIXTURE" --policy-profile strict 2>&1) || true
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "Verdict: BLOCK"; then
              echo "PASS: ${skill_dir} correctly blocked"
            else
              echo "::error::FAIL: ${skill_dir} was not blocked by SkillScan (expected BLOCK)"
              FAIL=1
            fi
          done
          # EICAR fixture: expect at least a finding (ALLOW with score > 0)
          FIXTURE="/tmp/cisco-skill-scanner/evals/test_skills/malicious/eicar-test"
          echo "=== Scanning eicar-test ==="
          OUTPUT=$(skillscan scan "$FIXTURE" --policy-profile strict 2>&1) || true
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qE "Score: [1-9]"; then
            echo "PASS: eicar-test produced findings"
          else
            echo "::error::FAIL: eicar-test produced no findings"
            FAIL=1
          fi
          # Safe fixture: must not be blocked
          FIXTURE="/tmp/cisco-skill-scanner/evals/test_skills/safe/simple-formatter"
          echo "=== Scanning simple-formatter (safe) ==="
          OUTPUT=$(skillscan scan "$FIXTURE" --policy-profile strict 2>&1) || true
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Verdict: ALLOW"; then
            echo "PASS: simple-formatter correctly allowed"
          else
            echo "::error::FAIL: simple-formatter was blocked (false positive)"
            FAIL=1
          fi
          exit $FAIL
